<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>膜拜虞博楠，物理冲满分！博楠一开讲，物理必称王！</title>
<style>
:root{--bg:#f8f9ff;--on:#191c20;--on2:#44474e;--pri:#0b57d0;--onpri:#fff;--pc:#d3e3fd;--sc:#e7ecf4;--out:#c4c6d0;
--g1:#4285f4;--g2:#ea4335;--g3:#fbbc04;--g4:#34a853;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111318;--on:#e2e2e9;--on2:#c4c6d0;--pri:#a8c7fa;--onpri:#062e6f;--pc:#0842a0;--sc:#1d2024;--out:#44474e}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--on);font-family:"Google Sans",Roboto,"Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;overflow:hidden}
#home{height:100%;display:flex;flex-direction:column;align-items:center;padding:20px 16px 24px;gap:16px;max-width:560px;margin:0 auto}
h1{margin:0;width:100%;font-size:clamp(24px,7vw,34px);line-height:1.25;font-weight:700;letter-spacing:.01em}
h1 span{display:block;color:var(--pri)}
.car{position:relative;flex:1;min-height:0;width:100%;border-radius:28px;overflow:hidden;background:var(--sc);touch-action:pan-y;user-select:none}
.sl{position:absolute;inset:0;opacity:0;transform:scale(1.06);transition:opacity .6s ease,transform .9s cubic-bezier(.2,0,0,1)}
.sl.on{opacity:1;transform:none}
.sl .bg,.sl .fg{position:absolute;inset:0;width:100%;height:100%}
.sl .bg{object-fit:cover;filter:blur(28px) saturate(1.2);transform:scale(1.2);opacity:.75}
.sl .fg{object-fit:contain}
.dots{position:absolute;left:0;right:0;bottom:14px;display:flex;justify-content:center;gap:6px}
.dots i{height:8px;width:8px;border-radius:4px;background:rgba(255,255,255,.7);box-shadow:0 0 0 1px rgba(0,0,0,.15);transition:width .35s cubic-bezier(.2,0,0,1),background .3s}
.dots i.on{width:26px;background:var(--pri)}
.nav{position:absolute;top:50%;width:40px;height:40px;margin-top:-20px;border:0;border-radius:50%;background:rgba(255,255,255,.8);color:#1b1b1f;font-size:20px;cursor:pointer;display:grid;place-items:center}
.nav.p{left:10px}.nav.n{right:10px}
.nav:focus-visible,.fab:focus-visible,.btn:focus-visible{outline:3px solid var(--pri);outline-offset:3px}
.fab{position:relative;overflow:hidden;border:0;cursor:pointer;height:64px;min-width:220px;padding:0 36px;border-radius:32px;background:var(--pri);color:var(--onpri);font:600 20px/1 inherit;font-family:inherit;letter-spacing:.06em;box-shadow:0 6px 16px rgba(11,87,208,.35);display:flex;align-items:center;justify-content:center;gap:12px;transition:border-radius .35s cubic-bezier(.2,0,0,1),min-width .35s cubic-bezier(.2,0,0,1),transform .2s}
.fab:active{transform:scale(.96);border-radius:22px}
.fab.load{min-width:64px;padding:0;border-radius:32px}
.fab .lb{transition:opacity .2s}
.fab.load .lb{display:none}
.spin{display:none;width:30px;height:30px}
.fab.load .spin{display:block;animation:rot 1.4s linear infinite}
.spin circle{fill:none;stroke:currentColor;stroke-width:4;stroke-linecap:round;stroke-dasharray:20 100;animation:dash 1.4s ease-in-out infinite}
@keyframes rot{to{transform:rotate(360deg)}}
@keyframes dash{0%{stroke-dasharray:4 100;stroke-dashoffset:0}50%{stroke-dasharray:60 100;stroke-dashoffset:-20}100%{stroke-dasharray:4 100;stroke-dashoffset:-80}}
.rip{position:absolute;border-radius:50%;background:currentColor;opacity:.25;transform:scale(0);animation:rp .6s ease-out forwards;pointer-events:none}
@keyframes rp{to{transform:scale(1);opacity:0}}
/* done page */
#done{position:fixed;inset:0;background:var(--bg);display:none;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:24px;text-align:center;z-index:5;clip-path:circle(0 at 50% 90%);overflow:hidden}
#done.open{display:flex;animation:reveal .75s cubic-bezier(.2,0,0,1) forwards}
@keyframes reveal{to{clip-path:circle(150% at 50% 90%)}}
.stage{position:relative;width:180px;height:180px;display:grid;place-items:center}
.stage .ring{position:absolute;inset:0;border-radius:50%;border:3px solid var(--pri);opacity:0;transform:scale(.6)}
.go .ring{animation:pulse 1.4s ease-out .5s 2}
.go .ring.b{animation-delay:.8s}
@keyframes pulse{0%{opacity:.7;transform:scale(.6)}100%{opacity:0;transform:scale(1.9)}}
.stage svg.ck{position:absolute;width:160px;height:160px;transform:scale(0) rotate(-90deg)}
.go svg.ck{animation:pop .9s cubic-bezier(.34,1.56,.64,1) .35s forwards}
@keyframes pop{to{transform:scale(1) rotate(0)}}
.cookie{fill:var(--pri);transform-origin:50% 50%}
.go .cookie{animation:spin 14s linear 1.2s infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.tick{fill:none;stroke:var(--onpri);stroke-width:9;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:70;stroke-dashoffset:70}
.go .tick{animation:draw .5s cubic-bezier(.3,0,0,1) 1s forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.t{opacity:0;transform:translateY(24px)}
.go .t{animation:up .6s cubic-bezier(.2,0,0,1) forwards}
@keyframes up{to{opacity:1;transform:none}}
#done h2{margin:0;font-size:clamp(28px,8vw,40px);font-weight:700}
#done p{margin:0;color:var(--on2);font-size:16px;max-width:30ch;line-height:1.6}
.score{display:flex;align-items:baseline;gap:6px;padding:10px 26px;border-radius:28px;background:var(--pc);color:var(--pri)}
.score b{font-size:48px;font-variant-numeric:tabular-nums;line-height:1}
.score small{font-size:18px;font-weight:600}
.chips{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.chips span{padding:8px 16px;border-radius:12px;border:1px solid var(--out);font-family:"Roboto Mono",ui-monospace,monospace;font-size:15px}
.acts{display:flex;gap:12px;margin-top:6px}
.btn{height:48px;padding:0 26px;border-radius:24px;border:0;font:600 16px inherit;font-family:inherit;cursor:pointer;position:relative;overflow:hidden}
.btn.f{background:var(--pri);color:var(--onpri)}
.btn.o{background:transparent;color:var(--pri);border:1px solid var(--out)}
.cf{position:absolute;left:50%;top:38%;pointer-events:none;will-change:transform}
.snack{position:fixed;left:16px;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));max-width:420px;margin:0 auto;background:#2f3033;color:#f1f0f4;border-radius:12px;padding:14px 16px;font-size:15px;text-align:left;transform:translateY(200%);visibility:hidden;transition:transform .45s cubic-bezier(.2,0,0,1),visibility 0s .45s;z-index:6}
.snack.show{transform:none;visibility:visible;transition-delay:0s}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;animation-delay:0s!important;transition-duration:.01s!important}}
</style>
</head>
<body>
<main id="home">
  <h1>膜拜虞博楠，物理冲满分！<span>博楠一开讲，物理必称王！</span></h1>
  <section class="car" id="car" aria-label="图片轮播"></section>
  <button class="fab" id="go"><span class="lb">开始膜拜</span><svg class="spin" viewBox="0 0 48 48"><circle cx="24" cy="24" r="18"/></svg></button>
</main>

<section id="done" aria-live="polite">
  <div class="stage" id="stage">
    <i class="ring"></i><i class="ring b"></i>
    <svg class="ck" viewBox="-50 -50 100 100"><path class="cookie" id="ck"/><path class="tick" d="M-18 1 L-6 14 L19 -13"/></svg>
  </div>
  <h2 class="t" style="animation-delay:1.1s">膜拜完成</h2>
  <div class="score t" style="animation-delay:1.25s"><small>物理</small><b id="num">0</b><small>分</small></div>
  <p class="t" style="animation-delay:1.4s">博楠已收到你的敬意。现在去做一道受力分析吧！</p>
  <div class="chips t" style="animation-delay:1.55s"><span>F = ma</span><span>v = s/t</span><span>满分</span></div>
  <div class="acts t" style="animation-delay:1.7s"><button class="btn o" id="back">返回首页</button><button class="btn f" id="again">再拜一次</button></div>
</section>
<div class="snack" id="snack">膜拜成功，物理成绩已提升</div>

const car=document.getElementById('car');
car.innerHTML=IMGS.map((s,i)=>`<div class="sl${i?'':' on'}"><img class="bg" src="${s}" alt=""><img class="fg" src="${s}" alt="虞博楠照片 ${i+1}"></div>`).join('')
 +'<button class="nav p" aria-label="上一张">‹</button><button class="nav n" aria-label="下一张">›</button><div class="dots">'+IMGS.map((_,i)=>`<i class="${i?'':'on'}"></i>`).join('')+'</div>';
const sl=[...car.querySelectorAll('.sl')],dt=[...car.querySelectorAll('.dots i')];let cur=0,timer;
function show(n){cur=(n+sl.length)%sl.length;sl.forEach((e,i)=>e.classList.toggle('on',i===cur));dt.forEach((e,i)=>e.classList.toggle('on',i===cur));reset()}
function reset(){clearTimeout(timer);timer=setTimeout(()=>show(cur+1),3000)}
car.querySelector('.p').onclick=()=>show(cur-1);car.querySelector('.n').onclick=()=>show(cur+1);
let sx=null;car.addEventListener('pointerdown',e=>sx=e.clientX);
car.addEventListener('pointerup',e=>{if(sx!==null&&Math.abs(e.clientX-sx)>40)show(cur+(e.clientX<sx?1:-1));sx=null});
reset();
function ripple(b,e){const r=b.getBoundingClientRect(),d=Math.max(r.width,r.height)*2,s=document.createElement('span');s.className='rip';
 s.style.cssText=`width:${d}px;height:${d}px;left:${(e.clientX||r.left+r.width/2)-r.left-d/2}px;top:${(e.clientY||r.top+r.height/2)-r.top-d/2}px`;b.appendChild(s);setTimeout(()=>s.remove(),650)}
document.querySelectorAll('.btn,.fab').forEach(b=>b.addEventListener('pointerdown',e=>ripple(b,e)));
// cookie shape
(function(){const n=12,R=40,a=5.5,p=[];for(let i=0;i<=240;i++){const t=i/240*Math.PI*2,r=R+a*Math.cos(n*t);p.push((r*Math.cos(t)).toFixed(1)+' '+(r*Math.sin(t)).toFixed(1))}
 document.getElementById('ck').setAttribute('d','M'+p.join('L')+'Z')})();
const go=document.getElementById('go'),done=document.getElementById('done'),stage=document.getElementById('stage'),snack=document.getElementById('snack');
let busy=false;
go.onclick=()=>{if(busy)return;busy=true;go.classList.add('load');clearTimeout(timer);setTimeout(finish,1500)};
function finish(){go.classList.remove('load');busy=false;done.classList.remove('go','open');void done.offsetWidth;done.classList.add('open');
 setTimeout(()=>{done.classList.add('go');burst();count()},500);
 setTimeout(()=>{snack.classList.add('show');setTimeout(()=>snack.classList.remove('show'),2800)},2200)}
function count(){const el=document.getElementById('num'),t0=performance.now();
 (function f(t){const k=Math.min(1,(t-t0-1200)/900);el.textContent=Math.round(100*(k<0?0:1-Math.pow(1-k,3)));if(k<1)requestAnimationFrame(f)})(t0)}
function burst(){const cols=['#4285f4','#ea4335','#fbbc04','#34a853'];const host=done;
 for(let i=0;i<70;i++){const s=document.createElement('i'),sz=6+Math.random()*9,k=i%3;
  s.className='cf';s.style.cssText=`width:${sz}px;height:${k==1?sz*2.2:sz}px;background:${cols[i%4]};border-radius:${k==0?'50%':'3px'}`;host.appendChild(s);
  const ang=Math.random()*Math.PI*2,d=120+Math.random()*Math.min(innerWidth,500)*.6,x=Math.cos(ang)*d,y=Math.sin(ang)*d-60;
  s.animate([{transform:'translate(-50%,-50%) scale(0)',opacity:1},{transform:`translate(${x}px,${y}px) rotate(${Math.random()*540}deg) scale(1)`,opacity:1,offset:.45},{transform:`translate(${x*1.15}px,${y+260}px) rotate(${Math.random()*900}deg) scale(.8)`,opacity:0}],
   {duration:1700+Math.random()*900,easing:'cubic-bezier(.2,.7,.3,1)',delay:Math.random()*150}).onfinish=()=>s.remove()}}
function close(){done.classList.remove('open','go');document.querySelectorAll('.cf').forEach(e=>e.remove());reset()}
document.getElementById('back').onclick=close;
document.getElementById('again').onclick=()=>{done.classList.remove('go');void done.offsetWidth;document.getElementById('num').textContent=0;done.classList.add('go');burst();count()};
</script>
